[phases.setup]
nixPkgs = ["python312", "nodejs_20"]

[phases.install]
cmds = [
  "python -m pip install -r requirements.txt",
  "npm ci --prefix frontend"
]

[phases.build]
cmds = ["npm run build --prefix frontend"]

[start]
cmd = "python -m uvicorn backend.app.main:app --host 0.0.0.0 --port ${PORT:-8002}"
