providers = ["python", "node"]

[env]
PYTHON_VERSION = "3.12"
NODE_VERSION = "20"

[phases.install]
cmds = [
  "npm install --prefix frontend",
  "pip install -r requirements.txt"
]

[phases.build]
cmds = ["npm run build --prefix frontend"]

[start]
cmd = "python -m uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT"